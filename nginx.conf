events {}

http {
    server {
        listen 80;

        # React frontend
        root /usr/share/nginx/html;
        index index.html;

        # API proxy
        location /api/ {
            proxy_pass http://localhost:5000/api/;
        }

        # SPA fallback
        location / {
            try_files $uri /index.html;
        }
    }
}
