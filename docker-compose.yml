version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Password123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - studentnet

  studentapp:
    build: .
    container_name: studentapp
    ports:
      - "8080:80"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__StudentDbContext: "Server=sqlserver,1433;Database=StudentDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
    networks:
      - studentnet

volumes:
  sql_data:

networks:
  studentnet:
